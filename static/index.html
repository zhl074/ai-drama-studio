<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 短剧生成 Agent 平台</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12161f; --panel2:#171c27; --line:#232a38;
    --text:#e8ecf4; --muted:#8792a6; --accent:#7c5cff; --accent2:#4f8cff;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;
  }
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}

  /* ---------- 侧栏 ---------- */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:16px;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
  .badge-row{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .badge.on{color:#a78bfa;border-color:#3b2f66;background:#1c1630}
  .btn-new{
    margin:14px;padding:10px;border-radius:10px;border:1px dashed #3a3350;
    background:#1a1630;color:#b9a6ff;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn-new:hover{background:#211a3d}
  .plist{flex:1;overflow-y:auto;padding:0 10px 10px}
  .pitem{
    padding:10px 11px;border-radius:9px;cursor:pointer;margin-bottom:6px;
    border:1px solid transparent;display:flex;gap:9px;align-items:center;
  }
  .pitem:hover{background:var(--panel2)}
  .pitem.active{background:var(--panel2);border-color:var(--accent)}
  .pitem img{width:44px;height:26px;object-fit:cover;border-radius:4px;background:#000;flex-shrink:0}
  .pitem .t{font-size:13px;line-height:1.3;margin-bottom:2px}
  .pitem .m{font-size:11px;color:var(--muted)}
  .side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

  /* ---------- 主区 ---------- */
  .main{overflow-y:auto;min-height:0;padding:26px 30px 60px}
  .empty{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:var(--muted);gap:14px;
  }
  .empty h2{color:var(--text);margin:0;font-size:20px}
  .empty .hint{font-size:13px;line-height:1.9;max-width:460px}

  .phead{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
  .cover{width:200px;height:112px;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--line);flex-shrink:0}
  .phead .info{flex:1;min-width:0}
  .phead h2{margin:0 0 6px;font-size:20px}
  .phead .genre{display:inline-block;font-size:11px;color:#a78bfa;background:#1c1630;border:1px solid #3b2f66;border-radius:20px;padding:2px 9px;margin-bottom:8px}
  .phead .logline{color:#c3cbdb;line-height:1.7;font-size:13.5px}
  .chars{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .char{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted)}
  .char b{color:var(--text);font-weight:600}

  h3.sec{font-size:13.5px;color:var(--muted);font-weight:500;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}

  /* 剧集卡 */
  .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .ep{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:13px;cursor:pointer;transition:.15s
  }
  .ep:hover{border-color:#3d4a63}
  .ep.active{border-color:var(--accent);background:#151222}
  .ep .num{font-size:11px;color:var(--muted);margin-bottom:4px}
  .ep .tt{font-size:13.5px;line-height:1.35;margin-bottom:8px;min-height:36px}
  .ep .st{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .ep-add{
    border:1px dashed #333c4e;background:transparent;border-radius:10px;
    color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px;
    display:flex;align-items:center;justify-content:center;min-height:96px;
  }
  .ep-add:hover{border-color:var(--accent);color:#b9a6ff}

  /* 步骤条 */
  .steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .step{
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;
  }
  .step.done{color:#86efac;border-color:#1e4632;background:#0f2318}
  .step.now{color:#c4b5fd;border-color:#3b2f66;background:#1c1630}
  .step .n{
    width:16px;height:16px;border-radius:50%;background:#2a3244;color:#aab3c5;
    font-size:10px;display:flex;align-items:center;justify-content:center
  }
  .step.done .n{background:#16a34a;color:#fff}
  .step.now .n{background:var(--accent);color:#fff}

  /* 分镜 */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .shot{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .shot .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0a0c11}
  .shot .body{padding:10px 11px}
  .shot .top{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#1e2532;color:#9fb0c9;border:1px solid var(--line)}
  .tag.no{background:#2a1f45;color:#c4b5fd;border-color:#3b2f66}
  .shot .desc{font-size:12px;color:#aeb9cc;line-height:1.6;margin-bottom:6px}
  .shot .dlg{font-size:12px;color:#e8ecf4;line-height:1.55;border-left:2px solid var(--accent);padding-left:8px}

  /* 操作区 */
  .actions{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}
  button.act{
    border:none;border-radius:9px;padding:10px 18px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s
  }
  .act.primary{background:var(--accent);color:#fff}
  .act.primary:hover{background:#6b4ae8}
  .act.ghost{background:var(--panel2);color:#c3cbdb;border:1px solid var(--line)}
  .act.ghost:hover{background:#1e2532}
  .act:disabled{opacity:.5;cursor:not-allowed}
  .act.small{padding:7px 13px;font-size:12px}
  .mode-sel{
    background:var(--panel2);color:#c3cbdb;border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;
  }
  .mode-sel:focus{outline:none;border-color:var(--accent)}

  .progress{flex:1;min-width:200px;height:6px;background:#1b2230;border-radius:6px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
  .pmsg{font-size:12px;color:var(--muted);min-width:160px}

  /* 视频 */
  .video-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  video{width:100%;max-width:820px;border-radius:8px;background:#000;display:block}
  .vmeta{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(5,7,11,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(560px,100%)}
  .modal h3{margin:0 0 6px;font-size:16px}
  .modal p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .modal textarea{
    width:100%;min-height:110px;resize:vertical;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    padding:11px;font-family:inherit;font-size:13.5px;line-height:1.6;outline:none
  }
  .modal textarea:focus{border-color:var(--accent)}
  .samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .samples button{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-family:inherit}
  .samples button:hover{color:var(--text);border-color:#3d4a63}
  .modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:#1e2532;border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;display:none
  }
  .toast.show{display:block}
  .loading{display:inline-block;width:13px;height:13px;border:2px solid #3a3350;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- 侧栏 -->
  <aside class="side">
    <div class="brand">
      <h1>🎬 短剧生成工作台</h1>
      <div class="sub">多模态创作 Agent 平台</div>
      <div class="badge-row" id="badgeRow">
        <span class="badge">加载中…</span>
      </div>
    </div>
    <button class="btn-new" id="btnNew">＋ 新建短剧项目</button>
    <div class="plist" id="plist"></div>
    <div class="side-foot" id="sideFoot">—</div>
  </aside>

  <!-- 主区 -->
  <main class="main" id="main">
    <div class="empty">
      <h2>开始你的第一部 AI 短剧</h2>
      <div class="hint">
        输入一句创意，Agent 会自动完成：<br />
        策划 → 剧本 → 分镜 → 画面 → 配音 → 合成 MP4
      </div>
      <button class="act primary" id="btnNew2">创建项目</button>
    </div>
  </main>
</div>

<!-- 新建项目弹窗 -->
<div class="modal" id="modal">
  <div class="box">
    <h3>新建短剧项目</h3>
    <p>描述一个创意方向即可。越具体，Agent 编得越好。</p>
    <textarea id="ideaInput" placeholder="例如：外卖员在暴雨夜送最后一单，发现收货人是三年前失踪的妹妹……"></textarea>
    <div class="samples" id="samples"></div>
    <div class="foot">
      <button class="act ghost" id="btnCancel">取消</button>
      <button class="act primary" id="btnCreate">开始策划</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { projects: [], project: null, episodes: [], episode: null, rendering: false, videoMode: 'kenburns' };

const $ = id => document.getElementById(id);
const mainEl = $('main'), plistEl = $('plist');

const SAMPLE_IDEAS = [
  '外卖员暴雨夜送最后一单，收货人是三年前失踪的妹妹',
  '公司实习生发现老板电脑里有个加密文件夹，名字是自己的身份证号',
  '离婚当天，她在民政局门口捡到一张彩票，中了五百万',
  '退休老警察在小区里发现，邻居每天凌晨三点都会拖一个行李箱出门',
  '外卖骑手和写字楼女白领互换手机一天，各自发现了对方生活的秘密'
];

function toast(msg, ms = 2200){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), ms);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ================= 健康检查 ================= */
async function loadHealth(){
  try{
    const r = await fetch('/api/health');
    const d = await r.json();
    const img = d.image_provider === 'dashscope' ? '真实生成' : '占位图';
    const tts = d.tts_provider === 'dashscope' ? '真实配音' : '占位音';
    const vmode = {kenburns:'推拉镜头', still:'静态', t2v:'文生视频'}[d.video_mode] || d.video_mode;
    const paidBadge = d.allow_paid
      ? '<span class="badge" style="color:#fbbf24;border-color:#5a4416;background:#241b07">付费已开启</span>'
      : '<span class="badge" style="color:#86efac;border-color:#1e4632;background:#0f2318">🔒 零成本模式</span>';
    $('badgeRow').innerHTML = `
      <span class="badge on">${esc(d.llm_model.split('-').slice(0,2).join('-'))}</span>
      ${paidBadge}
      <span class="badge">画面：${img}</span>
      <span class="badge">配音：${tts}</span>
      <span class="badge">镜头：${vmode}</span>`;
    $('sideFoot').textContent = `ffmpeg ${d.ffmpeg} · ${d.projects} 个项目`;
  }catch(e){
    $('badgeRow').innerHTML = '<span class="badge" style="color:#f87171">服务未连接</span>';
  }
}

/* ================= 项目列表 ================= */
async function loadProjects(){
  const r = await fetch('/api/projects');
  const d = await r.json();
  state.projects = d.projects || [];
  plistEl.innerHTML = state.projects.map(p => `
    <div class="pitem ${state.project && state.project.id === p.id ? 'active' : ''}"
         onclick="selectProject('${p.id}')">
      ${p.cover ? `<img src="/media/${esc(p.cover)}" alt="">` : '<img alt="">'}
      <div>
        <div class="t">${esc(p.title)}</div>
        <div class="m">${esc(p.genre)} · ${p.ep_count} 集</div>
      </div>
    </div>`).join('') || `<div style="color:#8792a6;font-size:12px;padding:14px 8px">还没有项目</div>`;
  if (state.projects.length) $('sideFoot').textContent =
    `ffmpeg 就绪 · ${state.projects.length} 个项目`;
}

/* ================= 新建项目 ================= */
function openModal(){
  $('ideaInput').value = '';
  $('samples').innerHTML = SAMPLE_IDEAS.map(s =>
    `<button data-idea="${esc(s)}">${esc(s.slice(0, 16))}…</button>`).join('');
  $('samples').querySelectorAll('button').forEach(b => {
    b.onclick = () => { $('ideaInput').value = b.dataset.idea; };
  });
  $('modal').classList.add('show');
  $('ideaInput').focus();
}
$('btnNew').onclick = openModal;
$('btnNew2').onclick = openModal;
$('btnCancel').onclick = () => $('modal').classList.remove('show');

$('btnCreate').onclick = async () => {
  const idea = $('ideaInput').value.trim();
  if (idea.length < 2){ toast('创意太短了'); return; }
  const btn = $('btnCreate');
  btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 策划中…';
  try{
    const r = await fetch('/api/projects', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ idea })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    $('modal').classList.remove('show');
    await loadProjects();
    await selectProject(d.project.id);
    toast('策划完成，可以生成剧本了');
  }catch(e){
    toast('创建失败：' + e.message, 4000);
  }finally{
    btn.disabled = false; btn.textContent = '开始策划';
  }
};

/* ================= 选中项目 ================= */
async function selectProject(pid){
  const r = await fetch('/api/projects/' + pid);
  if (!r.ok){ toast('项目加载失败'); return; }
  const d = await r.json();
  state.project = d.project;
  state.episodes = d.episodes || [];
  state.episode = null;
  if (state.episodes.length) state.episode = state.episodes[state.episodes.length - 1];
  await loadProjects();
  renderProject();
}

function renderProject(){
  const p = state.project;
  if (!p) return;
  const chars = (p.characters || []).map(c => `
    <span class="char"><b>${esc(c.name)}</b> · ${esc(c.role)}${c.trait ? ' · ' + esc(c.trait) : ''}</span>`).join('');

  const epCards = state.episodes.map(e => `
    <div class="ep ${state.episode && state.episode.id === e.id ? 'active' : ''}"
         onclick="selectEpisode('${e.id}')">
      <div class="num">第 ${e.ep_index} 集</div>
      <div class="tt">${esc(e.title || '未命名')}</div>
      <div class="st">
        <span class="dot ${e.video ? 'ok' : (e.shots && e.shots.length ? 'warn' : '')}"></span>
        ${e.video ? '已出片' : (e.shots && e.shots.length ? '有分镜，待渲染' : '草稿')}
        ${e.duration ? '· ' + e.duration.toFixed(1) + 's' : ''}
      </div>
    </div>`).join('');

  const nextIdx = (state.episodes.length ? Math.max(...state.episodes.map(e => e.ep_index)) : 0) + 1;

  mainEl.innerHTML = `
    <div class="phead">
      ${p.cover ? `<img class="cover" src="/media/${esc(p.cover)}" alt="">` : '<div class="cover"></div>'}
      <div class="info">
        <h2>${esc(p.title)}</h2>
        <span class="genre">${esc(p.genre)}</span>
        <div class="logline">${esc(p.logline)}</div>
        <div class="chars">${chars}</div>
      </div>
    </div>

    <h3 class="sec">分集</h3>
    <div class="eps">
      ${epCards}
      <button class="ep-add" id="btnAddEp">＋ 生成第 ${nextIdx} 集剧本</button>
    </div>

    <div id="epDetail"></div>
  `;

  $('btnAddEp').onclick = () => addEpisode(nextIdx);
  renderEpisodeDetail();
}

async function addEpisode(idx){
  const btn = $('btnAddEp');
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 编剧+分镜生成中…'; }
  try{
    const r = await fetch(`/api/projects/${state.project.id}/episodes`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ep_index: idx })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    await selectProject(state.project.id);
    const eps = state.episodes.filter(e => e.ep_index === idx);
    if (eps.length) state.episode = eps[eps.length - 1];
    renderProject();
    toast('剧本和分镜已生成');
  }catch(e){
    toast('生成失败：' + e.message, 5000);
    if (btn){ btn.disabled = false; btn.textContent = '＋ 生成第 ' + idx + ' 集剧本'; }
  }
}

function selectEpisode(eid){
  state.episode = state.episodes.find(e => e.id === eid) || null;
  renderProject();
}

/* ================= 单集详情 ================= */
function renderEpisodeDetail(){
  const e = state.episode;
  const box = $('epDetail');
  if (!e){ box.innerHTML = '<h3 class="sec">内容</h3><div style="color:#8792a6;font-size:13px">先点上面的按钮生成一集剧本</div>'; return; }

  const shots = e.shots || [];
  const hasImages = shots.length > 0 && shots.every(s => s.image);
  const stepDone = [true, shots.length > 0, hasImages, !!e.video];

  box.innerHTML = `
    <h3 class="sec">第 ${e.ep_index} 集 · ${esc(e.title || '')}</h3>

    <div class="steps">
      <div class="step done"><span class="n">1</span>策划</div>
      <div class="step ${stepDone[1] ? 'done' : 'now'}"><span class="n">2</span>剧本 + 分镜</div>
      <div class="step ${stepDone[2] ? 'done' : (stepDone[1] ? 'now' : '')}"><span class="n">3</span>画面 + 配音</div>
      <div class="step ${stepDone[3] ? 'done' : (stepDone[2] ? 'now' : '')}"><span class="n">4</span>合成成片</div>
    </div>

    <div class="actions">
      <select id="modeSel" class="mode-sel">
        <option value="kenburns">推拉镜头（免费）</option>
        <option value="still">静态硬切（免费）</option>
      </select>
      <button class="act primary" id="btnRender">${e.video ? '重新渲染' : '渲染成片'}</button>
      ${e.video ? `<a class="act ghost" style="text-decoration:none;display:inline-block"
                    href="/api/episodes/${e.id}/download">下载 MP4</a>` : ''}
      <div class="progress" id="pbar"><i></i></div>
      <span class="pmsg" id="pmsg">${shots.length} 个镜头 · 约 ${(e.duration || 0).toFixed(1)}s</span>
    </div>

    ${e.video ? `
      <div class="video-wrap">
        <video controls preload="metadata" src="/media/${esc(e.video)}"></video>
        <div class="vmeta">
          <span>✅ 成片已生成</span>
          <span>时长 ${(e.duration || 0).toFixed(1)} 秒</span>
          <span>${shots.length} 个镜头</span>
        </div>
      </div>` : ''}

    <h3 class="sec">分镜表（${shots.length}）</h3>
    <div class="shots">
      ${shots.map(s => `
        <div class="shot">
          ${s.image ? `<img class="thumb" src="/media/${esc(s.image)}" alt="">`
                    : `<div class="thumb"></div>`}
          <div class="body">
            <div class="top">
              <span class="tag no">#${s.no}</span>
              <span class="tag">${esc(s.shot_type)}</span>
              <span class="tag">${esc(s.camera)}</span>
              <span class="tag">${s.duration}s</span>
            </div>
            <div class="desc">${esc(s.desc)}</div>
            ${s.dialogue ? `<div class="dlg">${s.speaker ? esc(s.speaker) + '：' : ''}${esc(s.dialogue)}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>
  `;

  $('btnRender').onclick = () => renderEpisode(e.id);
  const sel = $('modeSel');
  if (sel){ sel.value = state.videoMode; sel.onchange = () => { state.videoMode = sel.value; }; }
}

/* ================= 渲染（SSE） ================= */
async function renderEpisode(eid){
  if (state.rendering) return;
  const sel = $('modeSel');
  const mode = sel ? sel.value : 'kenburns';
  state.videoMode = mode;
  if (mode === 't2v'){
    const ok = confirm(
      '「文生视频」会为每个镜头调用视频生成模型，按秒计费。\n\n' +
      '以 14 个镜头为例，大约消耗 15~20 元（取决于所选模型）。\n' +
      '且单个镜头需要 1~3 分钟生成，整集可能需要 20 分钟以上。\n\n' +
      '确定继续吗？'
    );
    if (!ok) return;
  }
  state.rendering = true;
  const btn = $('btnRender');
  btn.disabled = true;
  const bar = $('pbar')?.querySelector('i');
  const pmsg = $('pmsg');

  try{
    const r = await fetch(`/api/episodes/${eid}/render`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video_mode: mode })
    });
    if (!r.ok){ throw new Error('HTTP ' + r.status); }
    const reader = r.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';

    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts){
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (d.type === 'progress'){
          if (bar) bar.style.width = d.pct + '%';
          if (pmsg) pmsg.textContent = d.msg;
        } else if (d.type === 'done'){
          if (bar) bar.style.width = '100%';
          if (pmsg) pmsg.textContent = '渲染完成';
          toast('成片生成完成 🎉');
        } else if (d.type === 'error'){
          toast('渲染失败：' + d.message, 6000);
          if (pmsg) pmsg.textContent = '失败';
        }
      }
    }
  }catch(e){
    toast('渲染请求失败：' + e.message, 5000);
  }finally{
    state.rendering = false;
    await selectProject(state.project.id);
  }
}

/* ================= 启动 ================= */
(async function init(){
  await loadHealth();
  await loadProjects();
})();
</script>
